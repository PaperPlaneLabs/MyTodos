name: Release Todoz

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build for, for example v0.1.42
        required: true
        type: string
      build_windows:
        description: Build Windows release
        required: true
        default: true
        type: boolean
      build_linux:
        description: Build Linux release
        required: true
        default: true
        type: boolean
      build_macos_aarch64:
        description: Build Apple Silicon macOS release
        required: true
        default: true
        type: boolean
      build_macos_x86_64:
        description: Build Intel macOS release
        required: true
        default: true
        type: boolean

jobs:
  validate-release:
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.release_notes.outputs.notes }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}
      CHECKOUT_REF: ${{ github.event_name == 'push' && github.ref || format('refs/tags/{0}', github.event.inputs.tag) }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Validate versions and release notes
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION=$(jq -r '.version' package.json)
          PACKAGE_LOCK_VERSION=$(jq -r '.version' package-lock.json)
          PACKAGE_LOCK_ROOT_VERSION=$(jq -r '.packages[""].version' package-lock.json)
          TAURI_VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          CARGO_VERSION=$(awk '
            /^\[package\]$/ { in_package=1; next }
            in_package && /^version[[:space:]]*=/ {
              gsub(/^[^"]*"/, ""); gsub(/".*$/, ""); print; exit
            }
          ' src-tauri/Cargo.toml)
          CARGO_LOCK_VERSION=$(awk '
            /^\[\[package\]\]$/ { in_package=0 }
            /^name = "my-todos"$/ { in_package=1; next }
            in_package && /^version[[:space:]]*=/ {
              gsub(/^[^"]*"/, ""); gsub(/".*$/, ""); print; exit
            }
          ' src-tauri/Cargo.lock)

          if [[ "$PACKAGE_VERSION" != "$VERSION" || "$PACKAGE_LOCK_VERSION" != "$VERSION" || "$PACKAGE_LOCK_ROOT_VERSION" != "$VERSION" || "$TAURI_VERSION" != "$VERSION" || "$CARGO_VERSION" != "$VERSION" || "$CARGO_LOCK_VERSION" != "$VERSION" ]]; then
            echo "Version mismatch: tag=$VERSION package=$PACKAGE_VERSION lock=$PACKAGE_LOCK_VERSION lock-root=$PACKAGE_LOCK_ROOT_VERSION tauri=$TAURI_VERSION cargo=$CARGO_VERSION cargo-lock=$CARGO_LOCK_VERSION"
            exit 1
          fi

          MATCH_COUNT=$(jq --arg version "$VERSION" '[.[] | select(.version == $version)] | length' src/lib/data/releases.json)
          if [[ "$MATCH_COUNT" != "1" ]]; then
            echo "Expected exactly one release-notes entry for $VERSION; found $MATCH_COUNT"
            exit 1
          fi

          ENTRY=$(jq --arg version "$VERSION" '.[] | select(.version == $version)' src/lib/data/releases.json)
          TITLE=$(jq -r '.title' <<< "$ENTRY")
          SUMMARY=$(jq -r '.summary' <<< "$ENTRY")
          ITEM_COUNT=$(jq '[.highlights[], .fixes[]] | length' <<< "$ENTRY")
          if [[ -z "$TITLE" || "$TITLE" == "null" || -z "$SUMMARY" || "$SUMMARY" == "null" || "$ITEM_COUNT" == "0" ]]; then
            echo "Release $VERSION must include a title, summary, and at least one highlight or fix."
            exit 1
          fi

          {
            echo 'notes<<MYTODOS_RELEASE_NOTES'
            echo "## $TITLE"
            echo
            echo "$SUMMARY"
            if [[ $(jq '.highlights | length' <<< "$ENTRY") -gt 0 ]]; then
              echo
              echo '### Highlights'
              jq -r '.highlights[] | "- " + .' <<< "$ENTRY"
            fi
            if [[ $(jq '.fixes | length' <<< "$ENTRY") -gt 0 ]]; then
              echo
              echo '### Fixes'
              jq -r '.fixes[] | "- " + .' <<< "$ENTRY"
            fi
            echo 'MYTODOS_RELEASE_NOTES'
          } >> "$GITHUB_OUTPUT"

  release-windows:
    needs: validate-release
    if: ${{ github.event_name == 'push' || github.event.inputs.build_windows == 'true' }}
    permissions:
      contents: write
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}
      CHECKOUT_REF: ${{ github.event_name == 'push' && github.ref || format('refs/tags/{0}', github.event.inputs.tag) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: windows-x86_64

      - name: Install frontend dependencies
        run: npm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Todoz ${{ env.RELEASE_TAG }}
          releaseBody: ${{ needs.validate-release.outputs.notes }}
          releaseDraft: false
          prerelease: false
          releaseCommitish: main
          updaterJsonKeepUniversal: true

  release-linux-x86_64:
    needs: validate-release
    if: ${{ github.event_name == 'push' || github.event.inputs.build_linux == 'true' }}
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}
      CHECKOUT_REF: ${{ github.event_name == 'push' && github.ref || format('refs/tags/{0}', github.event.inputs.tag) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: linux-x86_64

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Todoz ${{ env.RELEASE_TAG }}
          releaseBody: ${{ needs.validate-release.outputs.notes }}
          releaseDraft: false
          prerelease: false
          releaseCommitish: main
          updaterJsonKeepUniversal: true

  release-macos-aarch64:
    needs: validate-release
    if: ${{ github.event_name == 'push' || github.event.inputs.build_macos_aarch64 == 'true' }}
    permissions:
      contents: write
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}
      CHECKOUT_REF: ${{ github.event_name == 'push' && github.ref || format('refs/tags/{0}', github.event.inputs.tag) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: macos-aarch64

      - name: Install frontend dependencies
        run: npm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Todoz ${{ env.RELEASE_TAG }}
          releaseBody: ${{ needs.validate-release.outputs.notes }}
          releaseDraft: false
          prerelease: false
          releaseCommitish: main
          args: --target aarch64-apple-darwin
          updaterJsonKeepUniversal: true

  release-macos-x86_64:
    needs: validate-release
    if: ${{ github.event_name == 'push' || github.event.inputs.build_macos_x86_64 == 'true' }}
    permissions:
      contents: write
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}
      CHECKOUT_REF: ${{ github.event_name == 'push' && github.ref || format('refs/tags/{0}', github.event.inputs.tag) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: macos-x86_64

      - name: Install frontend dependencies
        run: npm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Todoz ${{ env.RELEASE_TAG }}
          releaseBody: ${{ needs.validate-release.outputs.notes }}
          releaseDraft: false
          prerelease: false
          releaseCommitish: main
          args: --target x86_64-apple-darwin
          updaterJsonKeepUniversal: true

  upload-updater-jsons:
    needs: [validate-release, release-windows, release-linux-x86_64, release-macos-aarch64, release-macos-x86_64]
    if: ${{ always() && !cancelled() && needs.validate-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_NOTES: ${{ needs.validate-release.outputs.notes }}
    steps:
      - name: Generate and upload platform-specific updater JSONs
        run: |
          set -e
          VERSION="${RELEASE_TAG#v}"
          REPO="$GITHUB_REPOSITORY"
          PUB_DATE=$(gh release view "$RELEASE_TAG" --repo "$REPO" --json publishedAt --jq '.publishedAt')
          NOTES="$RELEASE_NOTES"
          gh release edit "$RELEASE_TAG" --repo "$REPO" --notes "$NOTES"

          make_json() {
            local filename="$1" url="$2" sig="$3"
            echo "{}" | jq \
              --arg version "$VERSION" \
              --arg notes "$NOTES" \
              --arg pub_date "$PUB_DATE" \
              --arg url "$url" \
              --arg sig "$sig" \
              '{version: $version, notes: $notes, pub_date: $pub_date, url: $url, signature: $sig}' > "$filename"
          }

          BASE="https://github.com/$REPO/releases/download/$RELEASE_TAG"
          ASSET_NAMES=$(gh release view "$RELEASE_TAG" --repo "$REPO" --json assets --jq '.assets[].name')

          find_asset_by_suffix() {
            local suffix="$1"
            local match=""
            local asset

            while IFS= read -r asset; do
              [[ "$asset" == *"$suffix" ]] || continue
              if [[ -n "$match" ]]; then
                echo "Multiple release assets match suffix $suffix: $match, $asset" >&2
                return 2
              fi
              match="$asset"
            done <<< "$ASSET_NAMES"

            [[ -n "$match" ]] || return 1
            printf '%s' "$match"
          }

          make_platform_json() {
            local filename="$1"
            local signature_suffix="$2"
            local signature_name
            local artifact_name
            local sig

            if signature_name=$(find_asset_by_suffix "$signature_suffix"); then
              artifact_name="${signature_name%.sig}"
              sig=$(gh release download "$RELEASE_TAG" --repo "$REPO" --pattern "$signature_name" --output -)
              make_json "$filename" "$BASE/$artifact_name" "$sig"
            else
              local status=$?
              if [[ $status -eq 2 ]]; then
                exit 1
              fi
              echo "No release asset matches suffix $signature_suffix; skipping $filename"
            fi
          }

          make_platform_json latest-windows-x86_64.json "_x64-setup.exe.sig"
          make_platform_json latest-darwin-aarch64.json "_aarch64.app.tar.gz.sig"
          make_platform_json latest-darwin-x86_64.json "_x64.app.tar.gz.sig"
          make_platform_json latest-linux-x86_64.json "_amd64.AppImage.tar.gz.sig"

          files=(latest-windows-x86_64.json latest-darwin-aarch64.json latest-darwin-x86_64.json latest-linux-x86_64.json)
          existing=()
          for f in "${files[@]}"; do [[ -f "$f" ]] && existing+=("$f"); done

          if [[ ${#existing[@]} -gt 0 ]]; then
            gh release upload "$RELEASE_TAG" "${existing[@]}" --repo "$REPO" --clobber
          fi
